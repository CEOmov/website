---
layout: default
---

<article class="article">
  <h1>{{ page.title }}</h1>
  <time>{{ page.date | date: '%B %d, %Y' }} · {{ content | number_of_words | divided_by: 200 | at_least: 1 }} min read</time>
  
  <div class="article-content">
    {{ content }}
  </div>

  {% if page.tags.size > 0 %}
  <div class="tags">
    {% for tag in page.tags %}
    <a href="{{ site.baseurl }}/topics#{{ tag | slugify }}" class="tag">{{ tag }}</a>
    {% endfor %}
  </div>
  {% endif %}
</article>
