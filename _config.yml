title: Karim Abdelali
include: ['_pages']
baseurl: ''
use_html_extension: false
open_external_links_in_new_tab: true
permalink: pretty
relative_permalinks: false

plugins:
  - jekyll-feed

collections:
  notes:
    output: true
    permalink: /:slug

defaults:
  - scope:
      path: "**/*"
    values:
      layout: "default"
  - scope:
      path: "_notes/**/*.md"
    values:
      layout: "note"
